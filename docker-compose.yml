services:
  clip-agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATA_DIR: /data
      PORT: "8000"
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-1200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      RENDER_PRESET: ${RENDER_PRESET:-veryfast}
      CLIP_WORKERS: ${CLIP_WORKERS:-1}
      DOWNLOAD_TIMEOUT_SEC: ${DOWNLOAD_TIMEOUT_SEC:-300}
    volumes:
      - clip-data:/data
    restart: unless-stopped

volumes:
  clip-data:
