# Fly.io config. Change `app` before the first deploy.
# Create the disk once: fly volumes create clip_data --size 5 --region iad

app = "clip-agent"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  WHISPER_MODEL = "base"
  WHISPER_DEVICE = "cpu"
  WHISPER_COMPUTE_TYPE = "int8"
  MAX_DURATION_SECONDS = "1800"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[mounts]]
  source = "clip_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
